<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSchool | Admin Login</title>

    <!-- CSS principal do site (reaproveita variáveis de cor, botões etc.) -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- Ícones Phosphor -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Axios: biblioteca para fazer requisições HTTP de forma simples -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <style>
        /* Centraliza o card de login na tela */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f8fafc;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 3rem;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .login-title {
            text-align: center;
            margin-bottom: 2rem;
            color: #0f172a;
            font-size: 1.5rem;
        }

        /* Estilo do grupo label + input */
        .field-group {
            margin-bottom: 1.2rem;
        }

        .field-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: #334155;
        }

        .field-group input {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
            color: #0f172a;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .field-group input:focus {
            border-color: #4f46e5; /* roxo do tema CodeSchool */
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        /* Botão de login ocupa toda a largura */
        .btn-login {
            width: 100%;
            padding: 0.9rem;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }

        .btn-login:hover { background: #4338ca; }

        /* Mensagem de erro vermelha exibida quando o login falha */
        .error-msg {
            display: none; /* oculta por padrão; o JS exibe quando necessário */
            color: #ef4444;
            text-align: center;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

    <!-- ======================= CARD DE LOGIN ======================= -->
    <div class="login-card">
        <h2 class="login-title">
            <i class="ph ph-terminal-window"></i> Admin Access
        </h2>

        <form id="login-form">
            <!-- Campo E-mail -->
            <div class="field-group">
                <label for="email">E-mail Administrativo</label>
                <input type="email" id="email" placeholder="admin@codeschool.edu.br" required>
            </div>

            <!-- Campo Senha -->
            <div class="field-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Sua senha" required>
            </div>

            <!-- Área de mensagem de erro (visível apenas ao falhar) -->
            <p id="error-msg" class="error-msg"></p>

            <button type="submit" class="btn-login">Entrar no Painel</button>
        </form>
    </div>
    <!-- ============================================================ -->

    <!-- Script de lógica de login -->
    <script src="js/login.js"></script>

</body>
</html>
