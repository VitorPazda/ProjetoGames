<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | CodeSchool</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        /* Override basic colors for admin to ensure high contrast regardless of the main site theme */
        :root {
            --admin-bg: #f8fafc;
            --admin-card: #ffffff;
            --admin-border: #cbd5e1;
            --admin-text: #334155;
            --admin-text-dark: #0f172a;
            --admin-primary: #4f46e5;
            --admin-primary-hover: #4338ca;
        }
        body { background: var(--admin-bg); color: var(--admin-text); }
        .admin-layout { display: flex; min-height: 100vh; }
        .sidebar { width: 250px; background: var(--admin-card); border-right: 1px solid var(--admin-border); padding: 2rem; box-shadow: 2px 0 10px rgba(0,0,0,0.05); z-index: 10; }
        .sidebar a { display: flex; align-items: center; gap: 0.8rem; padding: 0.8rem; color: var(--admin-text); cursor: pointer; border-radius: 6px; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.95rem; transition: all 0.2s; }
        .sidebar a:hover, .sidebar a.active { background: #eef2ff; color: var(--admin-primary); }
        .content { flex: 1; padding: 3rem; overflow-y: auto; background: var(--admin-bg); }
        .content h2 { color: var(--admin-text-dark); margin-bottom: 1.5rem; font-weight: 700; }
        .data-table { width: 100%; border-collapse: collapse; background: var(--admin-card); border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid var(--admin-border); }
        .data-table th, .data-table td { padding: 1.2rem; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 0.95rem; }
        .data-table th { background: #f1f5f9; color: var(--admin-text-dark); font-weight: 600; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.05em; }
        .data-table tr:hover { background-color: #f8fafc; }
        .panel { display: none; }
        .panel.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .form-crud { background: var(--admin-card); padding: 2rem; border-radius: 8px; margin-bottom: 2rem; border: 1px solid var(--admin-border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .form-crud h4 { margin-top: 0; margin-bottom: 1.5rem; color: var(--admin-text-dark); font-size: 1.1rem; border-bottom: 2px solid #f1f5f9; padding-bottom: 0.5rem; }
        
        .input-admin { padding: 0.8rem 1rem; border: 2px solid #cbd5e1; border-radius: 6px; background: #ffffff; color: var(--admin-text-dark); width: 100%; margin-bottom: 0.5rem; outline: none; transition: border-color 0.2s; font-family: inherit; font-size: 0.95rem; }
        .input-admin:focus { border-color: var(--admin-primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        .input-admin::placeholder { color: #94a3b8; }
        
        .btn-primary { background: var(--admin-primary); color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; white-space: nowrap; height: auto !important; }
        .btn-primary:hover { background: var(--admin-primary-hover); }
        .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.8rem; }
        .form-crud form { display: flex; flex-wrap: wrap; gap: 1.2rem; align-items: end; }
    </style>
</head>
<body class="bg-alt">
    <div class="admin-layout">
        <aside class="sidebar">
            <h3 style="margin-bottom: 2rem; color: var(--primary-color);"><i class="ph ph-terminal-window"></i> Painel Admin</h3>
            <a onclick="showPanel('formations')" class="menu-item active" id="menu-formations"><i class="ph ph-graduation-cap"></i> Formações</a>
            <a onclick="showPanel('news')" class="menu-item" id="menu-news"><i class="ph ph-newspaper"></i> Notícias</a>
            <a onclick="showPanel('events')" class="menu-item" id="menu-events"><i class="ph ph-calendar"></i> Eventos</a>
            <hr style="margin: 2rem 0; border: none; border-top: 1px solid var(--border-color);">
            <a onclick="logout()" style="color: #ef4444;"><i class="ph ph-sign-out"></i> Sair</a>
        </aside>

        <main class="content">
            <!-- Formações/GAME --> 
            <div id="panel-formations" class="panel active">
                <h2 style="margin-bottom: 1rem;">Gerenciar Jogos</h2>
                <div class="form-crud">
                    <h4>Novo Jogo</h4>
                    <form id="form-formations" style="display: flex; gap: 1rem; margin-top: 1rem;">
                        <div style="flex: 1;"><input type="text" id="f-title" class="input-admin" placeholder="Título" required></div>
                        <div style="flex: 2;"><input type="text" id="f-desc" class="input-admin" placeholder="Descrição" required></div>
                        <div style="flex: 2;"><input type="text" id="f-genero" class="input-admin" placeholder="Gênero" required></div>
                        <div style="flex: 1; min-width: 150px;">
                            <input type="file" id="f-img" class="input-admin" accept="image/jpeg,image/png,image/webp,image/gif" required style="padding: 0.55rem 1rem;">
                        </div>
                        <div><button type="submit" class="btn btn-primary" style="height: 40px;">Adicionar</button></div>
                    </form>
                </div>
                <table class="data-table">
                    <thead><tr><th>ID</th><th>Título</th><th>Descrição</th><th>Gênero</th><th>Imagem</th><th>Ações</th></tr></thead>
                    <tbody id="tbody-formations"></tbody>
                </table>
            </div>

            <!-- Notícias -->
            <div id="panel-news" class="panel">
                <h2 style="margin-bottom: 1rem;">Gerenciar Notícias</h2>
                <div class="form-crud">
                    <h4>Nova Notícia</h4>
                    <form id="form-news" enctype="multipart/form-data" style="display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 1rem;">
                        <div style="flex: 1; min-width: 200px;"><input type="text" id="n-title" class="input-admin" placeholder="Título" required></div>
                        <div style="flex: 1; min-width: 150px;"><input type="text" id="n-date" class="input-admin" placeholder="Data (ex: 10 de Out)" required></div>
                        <div style="flex: 1; min-width: 150px;">
                            <input type="file" id="n-img" class="input-admin" accept="image/jpeg,image/png,image/webp,image/gif" required style="padding: 0.55rem 1rem;">
                        </div>
                        <div style="flex: 100%;"><input type="text" id="n-desc" class="input-admin" placeholder="Descrição/Resumo" required></div>
                        <div id="n-preview" style="flex: 100%; display: none;">
                            <img id="n-preview-img" src="" alt="Preview" style="max-height: 120px; border-radius: 6px; border: 2px solid var(--admin-border);">
                        </div>
                        <div style="flex: 100%;"><button type="submit" class="btn btn-primary">Salvar Notícia</button></div>
                    </form>
                </div>
                <table class="data-table">
                    <thead><tr><th>ID</th><th>Título</th><th>Data</th><th>Imagem</th><th>Ações</th></tr></thead>
                    <tbody id="tbody-news"></tbody>
                </table>
            </div>

            <!-- Eventos -->
            <div id="panel-events" class="panel">
                <h2 style="margin-bottom: 1rem;">Gerenciar Eventos</h2>
                <div class="form-crud">
                    <h4>Novo Evento</h4>
                    <form id="form-events" style="display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 1rem;">
                        <div style="flex: 1; min-width: 200px;"><input type="text" id="e-title" class="input-admin" placeholder="Título do Evento" required></div>
                        <div style="flex: 1; min-width: 80px;"><input type="text" id="e-day" class="input-admin" placeholder="Dia (ex: 15)" required></div>
                        <div style="flex: 1; min-width: 80px;"><input type="text" id="e-month" class="input-admin" placeholder="Mês (ex: NOV)" required></div>
                        <div style="flex: 1; min-width: 150px;"><input type="text" id="e-time" class="input-admin" placeholder="Horário (ex: 19:30)" required></div>
                        <div style="flex: 100%;"><input type="text" id="e-loc" class="input-admin" placeholder="Local (ex: Auditório Principal)" required></div>
                        <div style="flex: 100%;"><button type="submit" class="btn btn-primary">Criar Evento</button></div>
                    </form>
                </div>
                <table class="data-table">
                    <thead><tr><th>ID</th><th>Dia/Mês</th><th>Título</th><th>Ações</th></tr></thead>
                    <tbody id="tbody-events"></tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="js/dashboard.js"></script>
</body>
</html>
